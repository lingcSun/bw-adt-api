name: build and agent-notes gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # npm test requires a live BW system (.env, BW_BASE_URL ...) and the
      # integration suites do not auto-skip offline yet, so CI runs build +
      # gate only until a skip-if-unset guard lands in the suites
      - run: npm run verify:agents
